<div class="controls">
    <div class="actions">
        <div class="action-buttons">
            <div title="{{ t('loras.controls.sort.title') }}" class="control-group sort-dropdown-group dropdown-group" data-sort-dropdown>
                <button type="button" class="sort-trigger" aria-haspopup="listbox" aria-expanded="false">
                    <span class="sort-trigger__label"></span>
                    <i class="fas fa-caret-down sort-trigger__caret" aria-hidden="true"></i>
                </button>
                <div class="dropdown-menu sort-dropdown-menu" role="listbox"></div>
                <select id="sortSelect" class="sort-select-native" tabindex="-1" aria-hidden="true">
                    <optgroup label="{{ t('loras.controls.sort.name') }}">
                        <option value="name:asc">{{ t('loras.controls.sort.nameAsc') }}</option>
                        <option value="name:desc">{{ t('loras.controls.sort.nameDesc') }}</option>
                    </optgroup>
                    <optgroup label="{{ t('loras.controls.sort.date') }}">
                        <option value="date:desc">{{ t('loras.controls.sort.dateDesc') }}</option>
                        <option value="date:asc">{{ t('loras.controls.sort.dateAsc') }}</option>
                    </optgroup>
                </select>
            </div>
            <div class="control-group">
                <button id="refreshButton" data-action="refresh" title="{{ t('loras.controls.refresh.title') }}"><i class="fas fa-sync"></i> <span>{{ t('common.actions.refresh') }}</span></button>
            </div>
            <div class="control-group">
                <button id="bulkOperationsBtn" data-action="bulk" title="{{ t('loras.controls.bulk.title') }}">
                    <i class="fas fa-th-large"></i> <span>{{ t('loras.controls.bulk.action') }}</span>
                </button>
            </div>
        </div>
    </div>
</div>
